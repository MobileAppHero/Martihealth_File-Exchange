<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1240" height="860" viewBox="0 0 1240 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="620" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Marti FX — Secure File Exchange (fx.martihealth.com)</text>
  <text x="620" y="70" text-anchor="middle" font-size="15" fill="#475569">One shared file store, two front doors, automatic clinical validation</text>

  <!-- ===== Actors row ===== -->
  <!-- Partner via web -->
  <rect x="60" y="110" width="250" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="185" y="146" text-anchor="middle" font-size="16" font-weight="650" fill="#312e81">Partner — Web User</text>
  <text x="185" y="170" text-anchor="middle" font-size="13" fill="#4338ca">Browser · email + password</text>
  <text x="185" y="188" text-anchor="middle" font-size="13" fill="#4338ca">upload / download only</text>

  <!-- Partner via SFTP -->
  <rect x="360" y="110" width="250" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="485" y="146" text-anchor="middle" font-size="16" font-weight="650" fill="#312e81">Partner — Automated System</text>
  <text x="485" y="170" text-anchor="middle" font-size="13" fill="#4338ca">SFTP · key-based auth</text>
  <text x="485" y="188" text-anchor="middle" font-size="13" fill="#4338ca">same folders as the portal</text>

  <!-- Marti admin -->
  <rect x="930" y="110" width="250" height="92" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1055" y="146" text-anchor="middle" font-size="16" font-weight="650" fill="#134e4a">Marti Admin</text>
  <text x="1055" y="170" text-anchor="middle" font-size="13" fill="#0f766e">TOTP 2-factor + IP allowlist</text>
  <text x="1055" y="188" text-anchor="middle" font-size="13" fill="#0f766e">sees all clients · provisions partners</text>

  <!-- ===== FX portal layer ===== -->
  <rect x="60" y="268" width="550" height="118" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="335" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">FX Portal / Transfer Layer</text>
  <text x="335" y="326" text-anchor="middle" font-size="13" fill="#475569">Each client jailed to their own folder — can never see other clients, can never delete</text>
  <text x="335" y="346" text-anchor="middle" font-size="13" fill="#475569">Short-lived signed transfer links · file-type allowlist · 1 GB cap</text>
  <text x="335" y="366" text-anchor="middle" font-size="13" fill="#475569">Every action (including denied attempts) written to the audit trail</text>

  <!-- Admin provisioning box -->
  <rect x="930" y="268" width="250" height="118" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1055" y="300" text-anchor="middle" font-size="16" font-weight="650" fill="#134e4a">One-click Provisioning</text>
  <text x="1055" y="326" text-anchor="middle" font-size="13" fill="#0f766e">new partner = folder +</text>
  <text x="1055" y="346" text-anchor="middle" font-size="13" fill="#0f766e">SFTP account + access keys,</text>
  <text x="1055" y="366" text-anchor="middle" font-size="13" fill="#0f766e">created from the portal UI</text>

  <!-- ===== Storage ===== -->
  <rect x="60" y="452" width="1120" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="484" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Shared Secure File Store (encrypted, access-controlled)</text>

  <!-- client folders -->
  <rect x="110" y="504" width="300" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="260" y="532" text-anchor="middle" font-size="14" font-weight="650" fill="#92400e">clients / partner-a /</text>
  <text x="260" y="556" text-anchor="middle" font-size="13" fill="#a16207">files · quarantine/</text>

  <rect x="470" y="504" width="300" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="620" y="532" text-anchor="middle" font-size="14" font-weight="650" fill="#92400e">clients / partner-b /</text>
  <text x="620" y="556" text-anchor="middle" font-size="13" fill="#a16207">files · quarantine/</text>

  <rect x="830" y="504" width="300" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="980" y="532" text-anchor="middle" font-size="14" font-weight="650" fill="#92400e">clients / … /</text>
  <text x="980" y="556" text-anchor="middle" font-size="13" fill="#a16207">one isolated folder per partner</text>

  <!-- ===== Validator ===== -->
  <rect x="330" y="668" width="580" height="118" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="620" y="700" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Clinical File Validator (automatic, on every arrival)</text>
  <text x="620" y="726" text-anchor="middle" font-size="13" fill="#075985">Parse-checks HL7 v2 · CCDA · FHIR JSON / NDJSON · XML — portal and SFTP uploads alike</text>
  <text x="620" y="752" text-anchor="middle" font-size="13" fill="#15803d" font-weight="650">✓ valid → stays in place</text>
  <text x="620" y="772" text-anchor="middle" font-size="13" fill="#b45309" font-weight="650">✗ invalid → moved to that client's quarantine/ + plain-English reason file</text>

  <!-- ===== Arrows ===== -->
  <!-- web partner -> portal -->
  <line x1="185" y1="202" x2="260" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="240" font-size="12.5" fill="#475569">HTTPS</text>
  <!-- sftp partner -> portal layer -->
  <line x1="485" y1="202" x2="420" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="240" font-size="12.5" fill="#475569">SFTP</text>
  <!-- admin -> provisioning -->
  <line x1="1055" y1="202" x2="1055" y2="268" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- admin box also browses portal -->
  <line x1="930" y1="156" x2="610" y2="300" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="742" y="212" font-size="12.5" fill="#0f766e">browse all clients</text>
  <!-- portal -> storage -->
  <line x1="335" y1="386" x2="335" y2="452" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="424" font-size="12.5" fill="#475569">① file lands in client folder</text>
  <!-- provisioning -> storage -->
  <line x1="1055" y1="386" x2="1055" y2="452" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1068" y="424" font-size="12.5" fill="#0f766e">creates folder</text>
  <!-- storage -> validator -->
  <line x1="540" y1="602" x2="540" y2="668" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="553" y="640" font-size="12.5" fill="#475569">② every new file triggers a check</text>
  <!-- validator -> back to storage (valid) -->
  <path d="M 350 710 C 240 710 200 660 200 604" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="92" y="652" font-size="12.5" fill="#15803d" font-weight="650">③ valid: untouched</text>
  <!-- validator -> quarantine (invalid) -->
  <path d="M 890 710 C 1000 710 1040 660 1040 604" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1048" y="652" font-size="12.5" fill="#b45309" font-weight="650">③ invalid: quarantined</text>

  <!-- footer -->
  <text x="620" y="830" text-anchor="middle" font-size="12.5" fill="#94a3b8">Marti Health · internal overview · no PHI shown</text>
</svg>
</body>
</html>
